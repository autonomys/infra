## installimage config for auto-drive-staging-01. In the rescue system:
##
##   curl -fsSL https://raw.githubusercontent.com/autonomys/infra/main/resources/terraform/auto-drive-staging/installimage.conf -o /autosetup
##   installimage
##
## Captured from installimage's own generated config for this box, with only
## SWRAIDLEVEL and HOSTNAME changed. The box boots BIOS, so there's no ESP partition.

DRIVE1 /dev/nvme0n1
DRIVE2 /dev/nvme1n1

## SWRAID is only the on/off switch; the generated default level is 1.
## installimage keeps /boot on RAID 1 whatever the level, so md1 shows raid1.
SWRAID 1
SWRAIDLEVEL 0

HOSTNAME auto-drive-staging-01

USE_KERNEL_MODE_SETTING yes

PART swap  swap 32G
PART /boot ext3 1024M
PART /     ext4 all

## 24.04 keeps staging one LTS ahead of production's 22.04, not two
IMAGE /root/.oldroot/nfs/install/../images/Ubuntu-2404-noble-amd64-base.tar.zst
