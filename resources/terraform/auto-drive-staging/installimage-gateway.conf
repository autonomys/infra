## installimage config for auto-drive-files-gateway-chronos. In the rescue system:
##
##   curl -fsSL https://raw.githubusercontent.com/autonomys/infra/main/resources/terraform/auto-drive-staging/installimage-gateway.conf -o /autosetup
##   installimage
##
## Captured from installimage's own generated config for this box, with only
## SWRAIDLEVEL and HOSTNAME changed. The box boots legacy BIOS, so there's no
## ESP partition. After first boot, run install-bios-grub.sh: the image's GRUB
## package targets UEFI.

DRIVE1 /dev/nvme0n1
DRIVE2 /dev/nvme1n1

## /, swap and /boot all mirrored across both drives
SWRAID 1
SWRAIDLEVEL 1

HOSTNAME auto-drive-files-gateway-chronos

USE_KERNEL_MODE_SETTING yes

PART swap  swap 32G
PART /boot ext3 1024M
PART /     ext4 all

IMAGE /root/.oldroot/nfs/install/../images/Ubuntu-2404-noble-amd64-base.tar.zst
