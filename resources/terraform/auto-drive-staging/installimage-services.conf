## installimage config for auto-drive-staging-services. In the rescue system:
##
##   curl -fsSL https://raw.githubusercontent.com/autonomys/infra/main/resources/terraform/auto-drive-staging/installimage-services.conf -o /autosetup
##   installimage
##
## The same hardware as the files gateway, which the rescue system confirmed
## (two matching NVMe drives, legacy BIOS, the same image), so this is
## installimage-gateway.conf with HOSTNAME changed. There's no ESP partition.
## After first boot, run install-bios-grub.sh: the image's GRUB package targets
## UEFI.

DRIVE1 /dev/nvme0n1
DRIVE2 /dev/nvme1n1

## /, swap and /boot all mirrored across both drives
SWRAID 1
SWRAIDLEVEL 1

HOSTNAME auto-drive-staging-services

USE_KERNEL_MODE_SETTING yes

PART swap  swap 32G
PART /boot ext3 1024M
PART /     ext4 all

IMAGE /root/.oldroot/nfs/install/../images/Ubuntu-2404-noble-amd64-base.tar.zst
