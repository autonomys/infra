## installimage config for auto-drive-staging-public. In the rescue system:
##
##   curl -fsSL https://raw.githubusercontent.com/autonomys/infra/main/resources/terraform/auto-drive-staging/installimage-public.conf -o /autosetup
##   installimage
##
## The box reported the same hardware as the files gateway from its old OS (two
## matching 476.9G NVMe drives, legacy BIOS), so this is installimage-gateway.conf
## with HOSTNAME changed. Confirm the drive names and image filename against the
## config installimage offers in the rescue system before using it. There's no
## ESP partition. After first boot, run install-bios-grub.sh: the image's GRUB
## package targets UEFI.

DRIVE1 /dev/nvme0n1
DRIVE2 /dev/nvme1n1

## /, swap and /boot all mirrored across both drives
SWRAID 1
SWRAIDLEVEL 1

HOSTNAME auto-drive-staging-public

USE_KERNEL_MODE_SETTING yes

PART swap  swap 32G
PART /boot ext3 1024M
PART /     ext4 all

IMAGE /root/.oldroot/nfs/install/../images/Ubuntu-2404-noble-amd64-base.tar.zst
