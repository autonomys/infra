## installimage config for monitoring-loki. In the rescue system:
##
##   curl -fsSL https://raw.githubusercontent.com/autonomys/infra/main/resources/terraform/monitoring/installimage.conf -o /autosetup
##   installimage
##
## Drive names assume the two SATA SSDs the box has carried so far. Confirm them,
## the image filename and the boot mode against installimage's own generated
## config before the first build (see README). If the box boots UEFI, add
##   PART /boot/efi esp 256M
## as the first partition.

DRIVE1 /dev/sda
DRIVE2 /dev/sdb

## Mirrored: losing either SSD must not cost the root filesystem or the data
SWRAID 1
SWRAIDLEVEL 1

HOSTNAME monitoring-loki

USE_KERNEL_MODE_SETTING yes

PART swap  swap 8G
PART /boot ext3 1024M
PART /     ext4 64G
## Loki and Traefik data live under /srv/monitoring, so log growth can't fill /
PART /srv  ext4 all

IMAGE /root/.oldroot/nfs/install/../images/Ubuntu-2404-noble-amd64-base.tar.zst
