# The services host's Postgres and RabbitMQ. Values come from the .env Terraform
# writes beside this file. The credentials are only in postgres.env and
# rabbitmq.env, which the containers read and the deploy's port check never
# resolves.

x-logging: &logging
  driver: loki
  options:
    loki-url: ${LOKI_URL:?}
    # a slow or unreachable Loki must never block the services' own writes
    mode: non-blocking
    max-buffer-size: 4m
    # the driver's local copy for `docker logs`, capped as on the rest of the fleet
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: ${POSTGRES_IMAGE:?}
    restart: unless-stopped
    # a fast shutdown ends in a checkpoint, which can outlast Docker's default 10s
    # before SIGKILL; cut short, the next start has to recover
    stop_grace_period: 2m
    env_file: postgres.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:?}
      - -c
      - effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:?}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:?}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:?}
      - -c
      - max_wal_size=${POSTGRES_MAX_WAL_SIZE:?}
      - -c
      - random_page_cost=${POSTGRES_RANDOM_PAGE_COST:?}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:?}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:?}
    shm_size: ${POSTGRES_SHM_SIZE:?}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:?}
    ports:
      - 127.0.0.1:5432:5432
      - ${MESH_ADDRESS:?}:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # over TCP, as clients connect: the socket also answers for the temporary
      # server the image runs during first initialisation
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    logging: *logging

  rabbitmq:
    image: ${RABBITMQ_IMAGE:?}
    restart: unless-stopped
    # the broker's node name, and with it where it finds its data, follows the
    # hostname
    hostname: rabbitmq
    stop_grace_period: 2m
    env_file: rabbitmq.env
    # Compose doesn't see a bind-mounted file change, and the broker reads conf.d
    # only at boot, so the file's hash recreates it when the file changes
    labels:
      auto-drive.rabbitmq-conf: "${RABBITMQ_CONF_HASH:?}"
    mem_limit: ${RABBITMQ_MEMORY_LIMIT:?}
    ports:
      - 127.0.0.1:5672:5672
      - ${MESH_ADDRESS:?}:5672:5672
      - 127.0.0.1:15672:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/90-auto-drive.conf:ro
    healthcheck:
      # as the rabbitmq user: a CLI run as root before the broker has written its
      # Erlang cookie writes a root-owned one, and the broker then fails to start
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s
    logging: *logging

volumes:
  postgres-data:
  rabbitmq-data:
