# The gateway's services, as autonomys/auto-files-gateway's docker/ compose files
# define them at the commit below, with the same variable names. Values come
# from the .env Terraform writes beside this file, secrets from the per-service
# env files. upstream-diff.sh in this module shows what has changed upstream
# since; move the commit when this file catches up.
#
# Unlike upstream, every port is published on loopback only, the mesh override
# adds the host's mesh address, and the RPC gateway publishes no P2P ports: it
# listens on none. Each app's migrations run in a one-shot service before it
# starts, since the images don't run them. Both apps are recreated when
# DATABASE_ID says the database was recreated, since each opens one Postgres
# connection and never opens another.
# upstream: 7c5093bd26c399e7e6f484cfc9e27b59f2ea04a2

volumes:
  subspace-node-data: {}
  file-retriever-data: {}

services:
  subspace-node:
    image: ${NODE_DOCKER_TAG:?}
    volumes:
      - subspace-node-data:/var/subspace:rw
    ports:
      - '30333:30333'
      - '30433:30433'
      - '127.0.0.1:9944:9944'
    restart: unless-stopped
    environment:
      - RUST_LOG=${RUST_LOG_NODE:-info}
    command: >
      run
      --chain ${NETWORK_ID:?}
      --base-path /var/subspace
      --listen-on /ip4/0.0.0.0/tcp/30333
      --dsn-listen-on /ip4/0.0.0.0/tcp/30433
      --rpc-cors all
      --rpc-methods unsafe
      --rpc-listen-on 0.0.0.0:9944
      --rpc-max-subscriptions-per-connection 1000
      --rpc-max-connections 20000
      --name object-mapping-node
      --sync full
      --create-object-mappings ${BLOCK_NUMBER_TO_START_FROM:?}
      --blocks-pruning archive
      --state-pruning archive
    healthcheck:
      timeout: 5s
      interval: 30s
      retries: 60
    stop_grace_period: 30s
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL:?}

  subspace-rpc-gateway:
    image: ${GATEWAY_DOCKER_TAG:?}
    depends_on:
      subspace-node:
        condition: service_healthy
        # The gateway never reconnects its node WebSocket, so restart it when Compose recreates the node.
        restart: true
    ports:
      - '127.0.0.1:9955:9955'
    restart: unless-stopped
    stop_grace_period: 30s
    command: rpc --node-rpc-url ws://subspace-node:9944/ws --rpc-listen-on 0.0.0.0:9955 --allow-private-ips --out-connections ${OUT_CONNECTIONS:?} --pending-out-connections ${PENDING_OUT_CONNECTIONS:?}
    environment:
      - RUST_LOG=${RUST_LOG_GATEWAY:-info}
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL:?}

  object-mapping-indexer-migrate:
    image: ${OBJECT_MAPPING_INDEXER_DOCKER_TAG:?}
    working_dir: /app
    command: yarn indexer db-migrate up
    env_file: object-mapping-indexer.env
    restart: 'no'
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL:?}

  object-mapping-app:
    image: ${OBJECT_MAPPING_INDEXER_DOCKER_TAG:?}
    container_name: object-mapping-app
    working_dir: /app
    labels:
      auto-drive.database-id: ${DATABASE_ID:-}
    ports:
      - '127.0.0.1:3000:3000'
    env_file: object-mapping-indexer.env
    environment:
      # constants
      - NODE_ENV=production
      - OBJECT_MAPPING_INDEXER_PORT=3000
      - NODE_RPC_URL=ws://subspace-node:9944/ws

      # variables
      - REQUEST_SIZE_LIMIT=${REQUEST_SIZE_LIMIT:?}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-}
      - LOG_LEVEL=${LOG_LEVEL:?}
      - RECOVERY_INTERVAL=${RECOVERY_INTERVAL:?}
    depends_on:
      subspace-node:
        condition: service_healthy
      object-mapping-indexer-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL:?}

  file-retriever-migrate:
    image: ${FILE_RETRIEVER_DOCKER_TAG:?}
    working_dir: /app
    command: yarn file-retriever db-migrate up
    env_file: file-retriever.env
    # both apps record their migrations in the same table, which neither run
    # should create while the other does
    depends_on:
      object-mapping-indexer-migrate:
        condition: service_completed_successfully
    restart: 'no'
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL:?}

  # CACHE_DIR is left to the app's default, which is where the volume is
  # mounted. Every other setting is passed even when it is the app's default:
  # an empty one reads as 0 or the working directory.
  file-retriever:
    image: ${FILE_RETRIEVER_DOCKER_TAG:?}
    container_name: file-retriever
    labels:
      auto-drive.database-id: ${DATABASE_ID:-}
    volumes:
      - file-retriever-data:/app/services/file-retriever/.cache
    ports:
      - '127.0.0.1:8090:8090'
    env_file: file-retriever.env
    environment:
      - NODE_ENV=production
      - SUBSPACE_GATEWAY_URLS=http://subspace-rpc-gateway:9955
      - CORS_ORIGIN=${CORS_ORIGIN:?}
      - MAX_SIMULTANEOUS_FETCHES=${MAX_SIMULTANEOUS_FETCHES:?}
      - CACHE_MAX_SIZE=${CACHE_MAX_SIZE:?}
      - CACHE_TTL=${CACHE_TTL:?}
      - LOG_LEVEL=${LOG_LEVEL:?}
      - VICTORIA_ACTIVE=${VICTORIA_ACTIVE:?}
      - VICTORIA_ENDPOINT=${VICTORIA_ENDPOINT:-}
      - VICTORIA_USERNAME=${VICTORIA_USERNAME:-}
      - METRIC_ENVIRONMENT_TAG=${METRIC_ENVIRONMENT_TAG:?}
      - OBJECT_MAPPING_INDEXER_URL=http://object-mapping-app:3000/ws
    depends_on:
      subspace-node:
        condition: service_healthy
      file-retriever-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL:?}
