# Installed on the host as ~/monitoring/docker-compose.yml by
# null_resource.deploy_monitoring_stack. Values in ${...} come from the .env
# Terraform writes next to it.

x-logging: &local-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3.7.17
    container_name: traefik
    restart: unless-stopped
    # Host networking puts 80 and 443 behind UFW's Cloudflare-only rules. Ports
    # Docker publishes bypass UFW, so nothing else here publishes beyond 127.0.0.1.
    network_mode: host
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=INFO
      - --accesslog=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # HTTP-01 through the Cloudflare proxy, so the box holds no DNS API token.
      # The challenge router outranks the redirect to websecure.
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/data/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    volumes:
      - ./traefik:/etc/traefik/dynamic:ro
      - ${DATA_DIR}/traefik:/data
    logging: *local-logging

  loki:
    image: grafana/loki:3.6.20
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    labels:
      monitoring.config-sha: ${LOKI_CONFIG_SHA}
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - ${DATA_DIR}/loki:/loki
    logging: *local-logging

  grafana:
    image: grafana/grafana:13.2.5
    container_name: grafana
    restart: unless-stopped
    labels:
      monitoring.config-sha: ${GRAFANA_CONFIG_SHA}
    environment:
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN}/
      # Only applied when Grafana creates its database. The deploy resets the
      # password from the same file on every run.
      GF_SECURITY_ADMIN_USER__FILE: /run/secrets/grafana_admin_user
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Keeps the version off /api/health for anyone not logged in
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      # Both would serve dashboards, and the logs in them, without a login
      GF_SNAPSHOTS_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - ${DATA_DIR}/grafana:/var/lib/grafana
    secrets:
      - grafana_admin_user
      - grafana_admin_password
    logging: *local-logging

secrets:
  grafana_admin_user:
    file: ./secrets/grafana_admin_user
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
