# The box's own metrics. vmagent runs in the host network, so every target is on
# 127.0.0.1, and it adds host=<the box's hostname> to everything it writes.
# instance carries the box's name, as on the host agents, so dashboards can tell
# servers apart; vmagent fills in %{MONITORING_HOSTNAME} from its environment.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          instance: "%{MONITORING_HOSTNAME}"

  # smartctl_exporter polls the disks every 60s, so scraping faster adds nothing
  - job_name: smartctl
    scrape_interval: 60s
    static_configs:
      - targets: ["127.0.0.1:9633"]
        labels:
          instance: "%{MONITORING_HOSTNAME}"

  - job_name: victoriametrics
    static_configs:
      - targets: ["127.0.0.1:8428"]
        labels:
          instance: "%{MONITORING_HOSTNAME}"

  - job_name: vmagent
    static_configs:
      - targets: ["127.0.0.1:8429"]
        labels:
          instance: "%{MONITORING_HOSTNAME}"

  - job_name: vmauth
    static_configs:
      - targets: ["127.0.0.1:8427"]
        labels:
          instance: "%{MONITORING_HOSTNAME}"

  - job_name: vmalert
    static_configs:
      - targets: ["127.0.0.1:8880"]
        labels:
          instance: "%{MONITORING_HOSTNAME}"

  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]
        labels:
          instance: "%{MONITORING_HOSTNAME}"

  - job_name: loki
    static_configs:
      - targets: ["127.0.0.1:3100"]
        labels:
          instance: "%{MONITORING_HOSTNAME}"

  - job_name: grafana
    static_configs:
      - targets: ["127.0.0.1:3000"]
        labels:
          instance: "%{MONITORING_HOSTNAME}"

  - job_name: traefik
    static_configs:
      - targets: ["127.0.0.1:8082"]
        labels:
          instance: "%{MONITORING_HOSTNAME}"

  # Slot and block times of each chain the chain probe reads; it reads once a
  # minute, so scraping faster adds nothing
  - job_name: chain-probe
    scrape_interval: 60s
    static_configs:
      - targets: ["127.0.0.1:9180"]
        labels:
          instance: "%{MONITORING_HOSTNAME}"

  # Chronos' public RPC names, probed through blackbox_exporter as any client
  # reaches them. probe_success says whether each answered healthy; up only
  # says the exporter answered.
  - job_name: rpc-probe
    scrape_interval: 60s
    scrape_timeout: 15s
    metrics_path: /probe
    params:
      module: [jsonrpc_health]
    static_configs:
      - targets:
          - https://rpc.chronos.autonomys.xyz/ws
          - https://rpc-0.chronos.autonomys.xyz/ws
          - https://auto-evm.chronos.autonomys.xyz/ws
          - https://auto-evm-0.chronos.autonomys.xyz/ws
        labels:
          network: chronos
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
