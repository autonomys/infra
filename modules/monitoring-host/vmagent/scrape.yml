# The box's own metrics. vmagent runs in the host network, so every target is on
# 127.0.0.1, and it adds host=<the box's hostname> to everything it writes.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  # smartctl_exporter polls the disks every 60s, so scraping faster adds nothing
  - job_name: smartctl
    scrape_interval: 60s
    static_configs:
      - targets: ["127.0.0.1:9633"]

  - job_name: victoriametrics
    static_configs:
      - targets: ["127.0.0.1:8428"]

  - job_name: vmagent
    static_configs:
      - targets: ["127.0.0.1:8429"]

  - job_name: vmauth
    static_configs:
      - targets: ["127.0.0.1:8427"]

  - job_name: vmalert
    static_configs:
      - targets: ["127.0.0.1:8880"]

  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]

  - job_name: loki
    static_configs:
      - targets: ["127.0.0.1:3100"]

  - job_name: grafana
    static_configs:
      - targets: ["127.0.0.1:3000"]

  - job_name: traefik
    static_configs:
      - targets: ["127.0.0.1:8082"]
